name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing
      - run: docker build -t opspilot:ci .
