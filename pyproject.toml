[project]
name = "opspilot"
version = "1.0.0"
description = "Slack-based DevOps incident management platform"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Laxman Prasad Mudigonda"}]
requires-python = ">=3.12"
keywords = ["incident-management", "devops", "sre", "slack", "fastapi", "celery"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.3",
  "redis==5.2.1",
  "celery[redis]==5.4.0",
  "httpx==0.28.1",
  "pydantic-settings==2.7.0",
  "slack-sdk==3.34.0",
  "prometheus-client==0.21.1",
  "python-multipart==0.0.20",
]

[project.urls]
Homepage = "https://github.com/laxmanmudigonda/OpsPilot"
Repository = "https://github.com/laxmanmudigonda/OpsPilot"
Issues = "https://github.com/laxmanmudigonda/OpsPilot/issues"

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --disable-warnings"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.coverage.run]
source = ["app"]
